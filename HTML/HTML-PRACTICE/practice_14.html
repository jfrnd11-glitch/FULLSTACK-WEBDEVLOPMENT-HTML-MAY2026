<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayant's Website</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }



        img {
            width: 200px;
            border-radius: 10px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Website Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Introduction -->
    <h2>About Me</h2>
    <p>My name is Jayant.</p>
    <p>I am learning HTML and CSS.</p>

    <!-- My Hobbies -->
    <h2>My Hobbies</h2>
    <ul>
        <li>Learning Coding</li>
        <li>Playing Cricket</li>
        <li>Watching Movies</li>
    </ul>

    <!-- Website Link -->
    <h2>Visit Google</h2>
    <a href="https://www.google.com" target="_blank">Open Google</a>

    <!-- Image -->
    <h2>My Image</h2>
    <img src="https://placehold.co/200x150" alt="Sample Image">

    <!-- Button -->
    <h2>Click the Button</h2>
    <button onclick="alert('Hello Jayant!')">Click Me</button>

    <!-- Contact Form -->
    <h2>Contact Me</h2>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
