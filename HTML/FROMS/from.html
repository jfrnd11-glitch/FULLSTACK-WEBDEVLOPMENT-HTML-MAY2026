<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header><h1>HTML FROM</h1></header>
    <main>
        <h2>USER REGISTRION</h2>
        <form action="#" method="get">
            <div>
                <label for="name">Name</label>
                <input type="text" name="name" id="name" required>

            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div>
                <label for="age">Age</label>
                <input type="number" name="age" id="age"
            </div>
            <div>
                <label for="dob">DOB</label>
                <input type="date" name="dob" id="dob"
            </div>
            <div>
                <label>Gender</label>
                <div>
                    <input type="radio" name="gender" id="male" value="male"
                    <label for="male">Male</label>
                </div>
                <div>
                    <input type="radio" name="gender" id="female" value="female"
                    <label for="female">Female</label>
                </div>
                <div>
                    <input type="radio" name="gender" id="other" value="other"
                    <label for="other">Other</label>
                </div>
            </div>
            
            <div>
                <label>Skill</label>
                <div>
                    <input type="checkbox" name="Skills" id="c-language" value="c-language"
                    <label for="c-language">c-language</label>
                </div>
                <div>
                    <input type="checkbox" name="Skills" id="python" value="python"
                    <label for="python">python</label>
                </div>
                <div>
                    <input type="checkbox" name="Skills" id="html" value="html"
                    <label for="html">html</label>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">
                </div>
                <div>
                    <label for="city">CITY</label>
                    <select name="city" id="city">
                        <option value="">select city</option>
                        <option value="siwan">siwan</option>
                        <option value="mirganj">mirganj</option>
                        <option value="gopalganj">gopalganj</option>
                    </select>
                </div>
                <div>
                    <label for="profile">profile</label>
                    <textarea name="profile" id="profile"></textarea>

                </div>
                <div>
                    <label for="resume">Resume</label>
                    <input type="file" name="resume" id="resume" accept=".pdf ,.doc,.docx">
                
                    
                </div>
                <button>submit</button>
        </form>

    </main>
    
</body>
</html>
